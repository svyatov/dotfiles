[tools]
erlang = "latest"
go = "latest"
node = "latest"
python = "latest"
ruby = "latest"
elixir = "latest"

[settings]
# Ignore tool versions published less than 7 days ago, so a compromised
# release has time to be caught before mise will install it
minimum_release_age = "7d"

[settings.ruby]
compile = false
