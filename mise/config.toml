[tools]
erlang = "latest"
go = "latest"
node = "latest"
python = "latest"
ruby = "latest"
elixir = "latest"
golangci-lint = "latest"
"go:golang.org/x/tools/gopls" = "latest"

[settings]
# Ignore tool versions published less than 3 days ago, so a compromised
# release has time to be caught before mise will install it
minimum_release_age = "3d"

[settings.ruby]
compile = false
